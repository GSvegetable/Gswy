name: Build font assets

on:
  push:
    branches: [main, "work/**"]

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install --upgrade fonttools brotli pillow
      - name: Build font files and UFO source
        run: python -m sources.gswy.build
      - name: Build Victorian Hand italic cut
        run: python -m sources.build_victorian_hand
      - name: Validate generated font files
        run: python -m sources.gswy.qa
      - name: Refresh checked-in specimen image
        run: |
          python -m sources.gswy.preview sample
          cp preview/样张.png docs/样张.png
      - name: Commit generated deliverables when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts/GswySerif-Regular.ttf fonts/GswySerif-Regular.otf fonts/GswySerif-Regular.woff2 fonts/GswyVictorianHand-Italic.ttf fonts/GswyVictorianHand-Italic.otf fonts/GswyVictorianHand-Italic.woff2 ufo/ docs/样张.png
          if ! git diff --cached --quiet; then
            git commit -m "Build verified Gswy Serif assets"
            git push
          fi
