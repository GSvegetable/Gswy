name: Font quality

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and preview dependencies
        run: python -m pip install --upgrade fonttools brotli pillow
      - name: Build font files
        run: python -m sources.gswy.build
      - name: Validate source and compiled fonts
        run: python -m sources.gswy.qa
      - name: Render specimen and glyph inspection sheets
        run: |
          python -m sources.gswy.preview sample
          python -m sources.gswy.preview grid "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789" latin-grid.png
          python -m sources.gswy.preview grid ".,:;!?‘’“”'-–—()[]/\\*+−=#$%&@_¡¿«»°•†‡§¶©®¢£¥€ƒ…µ" punctuation-grid.png
          python -m sources.gswy.preview grid "ÀÁÂÃÄÅÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜÝŸàáâãäåçèéêëìíîïñòóôõöùúûüýÿæÆœŒßøØÐðÞþ" accents-grid.png
          cp preview/样张.png docs/样张.png
      - name: Publish built font and preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: gswy-serif-build
          path: |
            fonts/GswySerif-Regular.ttf
            fonts/GswySerif-Regular.otf
            fonts/GswySerif-Regular.woff2
            preview/样张.png
            preview/latin-grid.png
            preview/punctuation-grid.png
            preview/accents-grid.png
          if-no-files-found: error
