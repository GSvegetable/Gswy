name: Font quality

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and preview dependencies
        run: python -m pip install --upgrade fonttools brotli pillow
      - name: Build font files
        run: python -m sources.gswy.build
      - name: Validate source and compiled fonts
        run: python -m sources.gswy.qa
      - name: Render specimen preview
        run: python -m sources.gswy.preview sample && cp preview/样张.png docs/样张.png
      - name: Commit generated font assets to the same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts/GswySerif-Regular.ttf fonts/GswySerif-Regular.otf fonts/GswySerif-Regular.woff2 ufo/ docs/样张.png
          if ! git diff --cached --quiet; then
            git commit -m "Build verified Gswy Serif font assets"
            git push
          fi
      - name: Publish built font and preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: gswy-serif-build
          path: |
            fonts/GswySerif-Regular.ttf
            fonts/GswySerif-Regular.otf
            fonts/GswySerif-Regular.woff2
            preview/样张.png
          if-no-files-found: error
